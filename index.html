<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Derrick - Dashboard</title>
    <style>
        body {
            background-color: #202124;
            color: #e8eaed;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 40px;
        }
        h1 {
            font-size: 48px;
            font-weight: 400;
            margin-bottom: 24px;
        }
        .search-form {
            width: 100%;
            margin-bottom: 30px;
        }
        .search-bar {
            width: 100%;
            padding: 14px 20px;
            background-color: #303134;
            border: 1px solid #5f6368;
            border-radius: 24px;
            color: #e8eaed;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
        }
        .link-card {
            width: 100%;
            background-color: #303134;
            border: 1px solid #5f6368;
            padding: 14px 16px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #e8eaed;
            text-decoration: none;
            margin-bottom: 12px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Derrick</h1>
        <form class="search-form" action="https://www.google.com/search" method="get" target="_blank">
            <input type="text" name="q" class="search-bar" placeholder="Search Google or type a URL" autocomplete="off">
        </form>
        <a href="https://github.com/derrick183-git" target="_blank" class="link-card">
            <span>Explore my GitHub repositories        </a>
    </div>
</body>
</html>
