<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BuzzWave Article</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="nav">
<div class="wrap navin">
<a class="brand" href="index.html">Buzz<span>Wave</span></a>
</div>
</header>
<main class="wrap" style="padding: 40px 0;">
<div id="articleContainer" style="max-width: 700px; margin: 0 auto;">
<p style="color: #888;">Loading article...</p>
</div>
</main>
<footer class="footer">
<div class="wrap">
<a class="brand" href="index.html">Buzz<span>Wave</span></a>
</div>
</footer>
<script>
(async () => {
  try {
    const params = new URLSearchParams(window.location.search);
    const articleId = parseInt(params.get('id') || '0', 10);
    
    const r = await fetch('stories.json?' + Date.now());
    if (!r.ok) throw new Error('Could not load stories');
    const stories = await r.json();
    
    const story = stories[articleId] || stories[0];
    if (!story) {
      document.getElementById('articleContainer').innerHTML = '<h2>Article not found</h2><p><a href="index.html">Back to Home</a></p>';
      return;
    }

    document.title = `${story.title} — BuzzWave`;
    
    const paragraphs = (story.story || '').split('\n').filter(p => p.trim() !== '').map(p => `<p style="margin-bottom: 20px;">${p}</p>`).join('');

    document.getElementById('articleContainer').innerHTML = `
      <p style="color: #ff2a75; font-weight: bold; text-transform: uppercase; font-size: 0.9rem; margin-bottom: 10px;">${story.category || 'News'}</p>
      <h1 style="font-size: 2.5rem; line-height: 1.2; margin-bottom: 20px; color: #fff;">${story.title}</h1>
      <p style="color: #888; font-size: 0.95rem; margin-bottom: 30px;">Published by ${story.author || 'BuzzWave Editorial'} • ${story.readTime || '5 min read'}</p>
      ${story.image ? `<div style="height: 350px; background: url('${story.image}') center/cover no-repeat; border-radius: 12px; margin-bottom: 40px;"></div>` : ''}
      <div style="font-size: 1.1rem; line-height: 1.8; color: #ddd;">
        ${paragraphs}
      </div>
    `;
  } catch (err) {
    document.getElementById('articleContainer').innerHTML = '<h2>Error loading article</h2><p><a href="index.html">Back to Home</a></p>';
  }
})();
</script>
<script src="assets/app.js"></script>
</body>
</html>
