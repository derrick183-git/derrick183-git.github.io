<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Derrick Search</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #171717;
            color: #e8eaed;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 16px;
            min-height: 100vh;
        }
        
        .top-nav {
            display: flex;
            align-items: center;
            padding-bottom: 20px;
            font-size: 14px;
            border-bottom: 1px solid #3c4043;
        }
        .nav-link { color: #8ab4f8; font-weight: 500; margin-right: 20px; text-decoration: none; border-bottom: 2px solid #8ab4f8; padding-bottom: 8px; }
        .nav-link-inactive { color: #9aa0a6; margin-right: 20px; text-decoration: none; }

        .main-container { text-align: center; margin-top: 30px; padding: 0 10px; }
        .logo { font-size: 48px; font-weight: 500; letter-spacing: -1px; margin-bottom: 25px; color: #ffffff; }
        
        .search-form {
            max-width: 600px;
            margin: 0 auto 20px auto;
        }
        .search-bar {
            background-color: #303134;
            border: 1px solid #5f6368;
            border-radius: 24px;
            height: 48px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            width: 100%;
        }
        .search-input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            width: 100%;
            font-size: 16px;
            margin-left: 10px;
        }

        .lang-options { color: #9aa0a6; font-size: 14px; margin-bottom: 35px; }
        .lang-options a { color: #8ab4f8; text-decoration: none; margin-left: 8px; }

        .trending-section { max-width: 600px; margin: 0 auto; text-align: left; }
        .trending-title { font-size: 20px; font-weight: 400; margin-bottom: 15px; color: #e8eaed; }
        
        .trending-item {
            display: flex;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #3c4043;
            text-decoration: none;
            color: #e8eaed;
            font-size: 16px;
        }
        .trending-icon {
            margin-right: 16px;
            color: #9aa0a6;
            font-size: 18px;
            font-weight: bold;
        }
        .contact-btn {
            background-color: #8ab4f8;
            color: #202124;
            padding: 8px 16px;
            border-radius: 18px;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            margin-left: auto;
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="#" class="nav-link">ALL</a>
        <a href="#" class="nav-link-inactive">IMAGES</a>
    </div>

    <div class="main-container">
        <div class="logo">Derrick</div>
        
        <form action="https://www.google.com/search" method="GET" class="search-form">
            <div class="search-bar">
                <span style="color:#9aa0a6; font-size: 20px;">&bull;</span>
                <input type="text" name="q" class="search-input" placeholder="Search Google or type a URL" required>
            </div>
        </form>

        <div class="lang-options">
            Offered in: <a href="#">Hausa</a> <a href="#">Akan</a> <a href="#">Ewe</a> <a href="#">Ga</a>
        </div>

        <div class="trending-section">
            <div class="trending-title">Trending searches</div>

            <a href="mailto:antwid838@gmail.com" class="trending-item">
                <span class="trending-icon">&#8599;</span>
                <span>Send me an email</span>
                <span class="contact-btn">Contact</span>
            </a>

            <a href="https://github.com" target="_blank" class="trending-item">
                <span class="trending-icon">&#8599;</span>
