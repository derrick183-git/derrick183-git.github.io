<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Derrick - Pulse Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111827;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #1f2937;
            margin-bottom: 24px;
            font-size: 13px;
        }

        .studio-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #9ca3af;
        }

        .studio-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
        }

        .time-badge {
            background: #1f2937;
            padding: 4px 10px;
            border-radius: 6px;
            color: #d1d5db;
            font-weight: 500;
        }

        .system-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 20px;
            padding: 0 4px;
        }

        .online-dot {
            color: #10b981;
            margin-right: 4px;
        }

        .header-section {
            margin-bottom: 24px;
        }

        .workspace-tag {
            background: #1f2937;
            color: #9ca3af;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: -1px;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .description {
            font-size: 14px;
            color: #9ca3af;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .search-form {
            position: relative;
            margin-bottom: 30px;
        }

        .search-input {
            width: 100%;
            padding: 14px 16px;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .search-input:focus {
            border-color: #10b981;
        }

        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #6b7280;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .link-card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 14px;
            padding: 18px;
            text-decoration: none;
            color: #fff;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .link-card:hover {
            border-color: #374151;
            background: #161f33;
        }
