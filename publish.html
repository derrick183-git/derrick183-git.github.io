<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Publish a Story — BuzzWave</title><link rel="stylesheet" href="../assets/style.css"></head><body><div class="breaking"><span>BUZZWAVE</span> PHONE-FRIENDLY PUBLISHER</div><header class="nav"><div class="wrap navin"><a class="brand" href="../index.html">Buzz<span>Wave</span></a></div></header><main class="wrap publish"><div class="eyebrow">EDITOR TOOL</div><h1>Publish a story</h1><p class="note">Write your story below. Tap Generate article file. Upload the generated HTML file into the GitHub <b>articles/</b> folder. This static tool cannot directly write to GitHub.</p><form onsubmit="generateArticle(event)"><label>Headline</label><input id="ptitle" required placeholder="Your story headline"><label>Category</label><select id="pcat"><option>News</option><option>Entertainment</option><option>Celebrity</option><option>Music</option><option>Culture</option></select><label>Author</label><input id="pauthor" placeholder="Your name or BuzzWave Editorial"><label>Story text</label><textarea id="pbody" required placeholder="Write your article. Put each paragraph on a new line."></textarea><button>Generate article file</button></form><p id="done"></p></main><footer><div class="wrap"><a class="brand" href="../index.html">Buzz<span>Wave</span></a></div></footer><script src="../assets/app.js"></script></body></html>
